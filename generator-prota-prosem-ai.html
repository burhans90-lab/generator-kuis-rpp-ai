<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generator Prota &amp; Prosem — Toolkit Guru AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<style>
:root{
  --violet-50:#faf8ff; --violet-100:#f2edff; --violet-200:#e4d9ff; --violet-300:#cdb8ff;
  --violet-400:#a985ff; --violet-500:#8b5cf6; --violet-600:#7440e8; --violet-700:#5f2fc7;
  --violet-800:#4b2599; --violet-900:#2e1863;
  --indigo-500:#6366f1; --ink:#211a35; --ink-soft:#5b5477; --line:#ece7fb;
  --bg:#fbfaff; --card:#ffffff; --shadow: 0 1px 2px rgba(46,24,99,.04), 0 8px 24px -8px rgba(88,44,199,.14);
  --shadow-lg: 0 20px 45px -18px rgba(76,32,180,.28);
  --radius:1.25rem;
  --joy:#f0b429; --meaning:#22b8a0; --mindful:#7c5cff;
  --ok:#1c9d6e; --ok-bg:#e8f8f1; --warn:#b8790a; --warn-bg:#fef6e6; --err:#b3123a; --err-bg:#fdecef;
}
[data-theme="dark"]{
  --violet-50:#241a3d; --violet-100:#2c2049; --violet-200:#3a2c60; --violet-300:#4c3a7c;
  --ink:#f1edff; --ink-soft:#b8aede; --line:#3a2f58;
  --bg:#150f26; --card:#1d1636; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 30px -8px rgba(0,0,0,.5);
  --shadow-lg: 0 20px 50px -18px rgba(0,0,0,.6);
  --ok-bg:#0f2c22; --warn-bg:#3a2a0c; --err-bg:#3a1420;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
  background:
    radial-gradient(1200px 600px at 90% -10%, var(--violet-100), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, var(--violet-50), transparent 55%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
  transition:background .3s ease, color .3s ease;
}
.serif{ font-family:'Lora', serif; }
h1,h2,h3{ margin:0; }
button{ font-family:inherit; cursor:pointer; }
input,textarea,select{ font-family:inherit; }
::selection{ background:var(--violet-300); }
.wrap{ max-width:1180px; margin:0 auto; padding:0 20px 80px; }
.header{
  position:sticky; top:0; z-index:40; backdrop-filter:blur(10px);
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  border-bottom:1px solid var(--line);
}
.header-inner{ max-width:1180px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.brand{ display:flex; align-items:center; gap:12px; }
.brand-mark{
  width:42px; height:42px; border-radius:12px; flex:none;
  background:linear-gradient(135deg, var(--violet-500), var(--indigo-500));
  display:flex; align-items:center; justify-content:center; color:white; font-weight:800; font-size:16px;
  box-shadow:var(--shadow);
}
.brand-title{ font-weight:800; font-size:15px; line-height:1.25; letter-spacing:-.01em; }
.brand-sub{ font-size:11.5px; color:var(--ink-soft); font-weight:600; letter-spacing:.02em; }
.header-actions{ display:flex; align-items:center; gap:8px; }
.icon-btn{
  width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--card);
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft); transition:.15s;
  position:relative;
}
.icon-btn:hover{ color:var(--violet-600); border-color:var(--violet-300); transform:translateY(-1px); box-shadow:var(--shadow); }
.badge-dot{ position:absolute; top:-4px; right:-4px; width:9px; height:9px; border-radius:50%; background:var(--joy); border:2px solid var(--bg); }

.progress-nav{ display:flex; gap:6px; padding:10px 0 0; max-width:1180px; margin:0 auto; }
.progress-nav-item{ flex:1; height:4px; border-radius:99px; background:var(--line); overflow:hidden; }
.progress-nav-item i{ display:block; height:100%; width:0%; background:linear-gradient(120deg,var(--violet-500),var(--indigo-500)); transition:width .3s ease; }

.hero{ padding:56px 0 28px; text-align:center; }
.eyebrow{
  display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px;
  background:var(--violet-100); color:var(--violet-700); font-size:12.5px; font-weight:700; letter-spacing:.03em; margin-bottom:18px;
}
[data-theme="dark"] .eyebrow{ color:var(--violet-300); }
.hero h1{ font-size:clamp(28px,4.2vw,42px); font-weight:800; letter-spacing:-.02em; line-height:1.12; }
.hero h1 span{ background:linear-gradient(120deg,var(--violet-600),var(--indigo-500)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hero p{ max-width:640px; margin:14px auto 0; color:var(--ink-soft); font-size:15.5px; line-height:1.6; }
.principles-row{ display:flex; gap:10px; justify-content:center; margin-top:24px; flex-wrap:wrap; }
.pill{ display:flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:12.5px; font-weight:700; box-shadow:var(--shadow); }
.pill i{ width:8px; height:8px; border-radius:50%; }

.autosave-bar{ display:flex; align-items:center; justify-content:flex-end; gap:10px; margin:-6px 2px 14px; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap; }
.autosave-bar .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
.autosave-bar button{ background:none; border:none; color:var(--violet-600); font-weight:700; font-size:11.5px; text-decoration:underline; padding:0; }

.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.section-card{ padding:28px; margin-bottom:22px; position:relative; }
.section-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:22px; }
.section-num{
  width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--violet-500),var(--indigo-500));
  color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex:none;
}
.section-title-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.section-title{ font-size:17px; font-weight:800; letter-spacing:-.01em; }
.section-desc{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
.section-status{ margin-left:auto; font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; white-space:nowrap; }
.section-status.ok{ background:var(--ok-bg); color:var(--ok); }
.section-status.warn{ background:var(--warn-bg); color:var(--warn); }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.alokasi-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
@media (max-width:640px){ .alokasi-grid{ grid-template-columns:1fr; } }
@media (max-width:720px){ .grid2{ grid-template-columns:1fr; } }
.field{ display:flex; flex-direction:column; gap:6px; }
.field.full{ grid-column:1/-1; }
label{ font-size:12.5px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px; }
label .opt{ font-weight:500; color:var(--ink-soft); font-size:11px; }
label .req{ color:#e2436b; }
label .charcount{ margin-left:auto; font-weight:500; color:var(--ink-soft); font-size:10.5px; }
.input, textarea, select{
  border:1.5px solid var(--line); background:var(--bg); border-radius:11px; padding:10px 13px; font-size:13.5px; color:var(--ink);
  outline:none; transition:.15s; width:100%;
}
.input:focus, textarea:focus, select:focus{ border-color:var(--violet-400); box-shadow:0 0 0 4px var(--violet-100); }
textarea{ resize:vertical; min-height:80px; line-height:1.5; }
.hint{ font-size:11.5px; color:var(--ink-soft); }
.field-error-text{ font-size:11.5px; color:var(--err); font-weight:700; }
.field.invalid .input, .field.invalid textarea, .field.invalid select{ border-color:var(--err); background:var(--err-bg); }
.pw-wrap{ position:relative; }
.pw-wrap .input{ padding-right:40px; }
.pw-toggle{ position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--ink-soft); padding:4px; }

.subcard{ border:1.5px solid var(--line); border-radius:14px; padding:18px; background:var(--bg); }
.subcard-title{ font-weight:800; font-size:13.5px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.subcard-title .tag{ font-size:10px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--violet-100); color:var(--violet-700); }

.check-grid{ display:grid; gap:8px; }
.check-grid.c2{ grid-template-columns:1fr 1fr; }
.check-grid.c3{ grid-template-columns:1fr 1fr 1fr; }
@media (max-width:640px){ .check-grid.c2, .check-grid.c3{ grid-template-columns:1fr 1fr; } }
.chk{
  display:flex; align-items:center; gap:8px; padding:9px 11px; border-radius:10px; border:1.5px solid var(--line);
  background:var(--bg); font-size:12.5px; font-weight:600; cursor:pointer; transition:.15s; user-select:none;
}
.chk:hover{ border-color:var(--violet-300); }
.chk.active{ border-color:var(--violet-500); background:var(--violet-100); color:var(--violet-700); }
[data-theme="dark"] .chk.active{ color:var(--violet-200); }
.chk input{ accent-color:var(--violet-600); width:15px; height:15px; flex:none; }

.output-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; }
.output-card{
  border:1.75px solid var(--line); border-radius:16px; padding:18px 16px; cursor:pointer; transition:.18s;
  background:var(--bg); display:flex; flex-direction:column; gap:10px; position:relative;
}
.output-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
.output-card.active{ border-color:var(--violet-500); background:linear-gradient(160deg,var(--violet-100),var(--card)); box-shadow:var(--shadow); }
.output-icon{
  width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px;
  background:var(--violet-100); color:var(--violet-700);
}
.output-card.active .output-icon{ background:linear-gradient(135deg,var(--violet-500),var(--indigo-500)); color:#fff; }
.output-name{ font-weight:800; font-size:13.5px; }
.output-desc{ font-size:11.5px; color:var(--ink-soft); line-height:1.4; }
.output-check{ position:absolute; top:14px; right:14px; width:19px; height:19px; border-radius:6px; border:1.75px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; font-size:11px; color:transparent; }
.output-card.active .output-check{ background:var(--violet-600); border-color:var(--violet-600); color:#fff; }
.output-count-pill{ font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; background:var(--violet-100); color:var(--violet-700); margin-left:auto; white-space:nowrap; }

.upload-zone{ border:1.75px dashed var(--line); border-radius:14px; padding:22px; text-align:center; background:var(--bg); transition:.15s; position:relative; cursor:pointer; }
.upload-zone.drag{ border-color:var(--violet-400); background:var(--violet-100); }
.upload-zone.reading{ opacity:.7; }
.upload-zone input[type=file]{ display:none; }
.file-chip{ display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; background:var(--violet-100); color:var(--violet-700); font-size:12px; font-weight:700; margin-top:10px; }
.file-chip button{ background:none; border:none; color:inherit; font-weight:800; }
.file-meta{ font-size:11px; color:var(--ink-soft); margin-top:6px; }
.file-progress-track{ height:5px; border-radius:99px; background:var(--line); margin-top:10px; overflow:hidden; }
.file-progress-fill{ height:100%; background:linear-gradient(120deg,var(--violet-500),var(--indigo-500)); transition:width .2s; }

.gen-row{ display:flex; gap:10px; flex-wrap:wrap; }
.gen-btn{
  flex:1; min-width:220px; padding:17px; border:none; border-radius:16px; font-weight:800; font-size:15.5px; color:#fff;
  background:linear-gradient(120deg,var(--violet-600),var(--indigo-500)); box-shadow:0 14px 30px -10px rgba(116,64,232,.55);
  display:flex; align-items:center; justify-content:center; gap:10px; transition:.15s;
}
.gen-btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 18px 36px -10px rgba(116,64,232,.65); }
.gen-btn:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
.gen-btn.loading{ opacity:.85; }
.preview-btn{
  padding:17px 20px; border-radius:16px; font-weight:800; font-size:13.5px; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  display:flex; align-items:center; justify-content:center; gap:8px; transition:.15s;
}
.preview-btn:hover:not(:disabled){ border-color:var(--violet-300); color:var(--violet-700); }
.preview-btn:disabled{ opacity: .6; cursor: not-allowed; }

.error-box{ display:flex; gap:8px; align-items:flex-start; padding:12px 14px; border-radius:12px; background:var(--err-bg); color:var(--err); font-size:12.5px; font-weight:600; margin-bottom:16px; border:1px solid #f7c9d4; }
[data-theme="dark"] .error-box{ border-color:#5c1c30; }
.warn-box{ display:flex; gap:8px; align-items:flex-start; padding:12px 14px; border-radius:12px; background:var(--warn-bg); color:var(--warn); font-size:12.5px; font-weight:600; margin-bottom:16px; border:1px solid #f2dca3; }
[data-theme="dark"] .warn-box{ border-color:#5c4a1c; }
.error-box ul, .warn-box ul{ margin:0; padding-left:16px; }

.modal-backdrop{ position:fixed; inset:0; background:rgba(20,12,42,.5); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; }
.modal{ background:var(--card); border-radius:20px; padding:28px; max-width:440px; width:100%; box-shadow:var(--shadow-lg); border:1px solid var(--line); max-height:86vh; overflow-y:auto; }
.modal.wide{ max-width:720px; }
.modal h3{ font-size:17px; font-weight:800; margin-bottom:4px; }
.modal-close{ float:right; background:none; border:none; color:var(--ink-soft); font-size:20px; line-height:1; }
.modal-actions{ display:flex; gap:10px; margin-top:20px; }
.btn{ padding:10px 18px; border-radius:11px; font-weight:700; font-size:13px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); transition:.15s; }
.btn:hover:not(:disabled){ border-color:var(--violet-300); }
.btn:disabled{ opacity:0.6; cursor:not-allowed; }
.btn.primary{ background:linear-gradient(120deg,var(--violet-600),var(--indigo-500)); color:#fff; border:none; flex:1; }
.btn.primary:hover:not(:disabled){ opacity:.92; }
.btn.ghost{ flex:1; }
.btn.sm{ padding:7px 12px; font-size:11.5px; }

.prompt-tabs{ display:flex; gap:8px; margin:14px 0 10px; }
.prompt-tabs button{ flex:1; padding:8px 10px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); font-weight:700; font-size:12px; color:var(--ink-soft); }
.prompt-tabs button.active{ background:var(--violet-100); border-color:var(--violet-400); color:var(--violet-700); }
.prompt-pre{ background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:14px; font-size:11.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; max-height:420px; overflow-y:auto; font-family:'SFMono-Regular',Consolas,monospace; }

.hist-item{ padding:12px 14px; border-radius:12px; border:1px solid var(--line); margin-bottom:8px; cursor:pointer; transition:.15s; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.hist-item:hover{ border-color:var(--violet-300); background:var(--violet-50); }
.hist-title{ font-weight:700; font-size:13px; }
.hist-time{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
.hist-empty{ text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px; }
.hist-del{ background:none; border:none; color:var(--ink-soft); font-size:14px; flex:none; }
.hist-del:hover{ color:var(--err); }

.results-wrap{ margin-top:10px; }
.results-badges{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
.results-badges .spacer{ flex:1; }
.tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:0; }
.tab{
  padding:11px 18px; border-radius:12px 12px 0 0; font-weight:700; font-size:13px; border:1.5px solid var(--line); border-bottom:none;
  background:var(--bg); color:var(--ink-soft); white-space:nowrap; transition:.15s; display:flex; align-items:center; gap:6px;
}
.tab.active{ background:var(--card); color:var(--violet-700); border-color:var(--violet-300); }
[data-theme="dark"] .tab.active{ color:var(--violet-200); }
.tab-warn-dot{ width:7px; height:7px; border-radius:50%; background:var(--warn); flex:none; }
.tab-panel{ border:1.5px solid var(--violet-300); border-radius:0 16px 16px 16px; background:var(--card); padding:26px; box-shadow:var(--shadow); }
.tab-toolbar{ display:flex; gap:8px; justify-content:flex-end; margin-bottom:18px; flex-wrap:wrap; }
.tool-btn{ display:flex; align-items:center; gap:6px; padding:8px 13px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); font-size:12px; font-weight:700; color:var(--ink); }
.tool-btn:hover{ border-color:var(--violet-300); color:var(--violet-700); }
.tool-btn:disabled{ opacity:.55; cursor:not-allowed; }
.parse-warn-note{ display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:10px; background:var(--warn-bg); color:var(--warn); font-size:11.5px; font-weight:600; margin-bottom:14px; }
.doc-content{ font-size:14px; line-height:1.75; color:var(--ink); }
.doc-content h1, .doc-content h2, .doc-content h3{ font-family:'Lora',serif; margin-top:1.4em; margin-bottom:.5em; color:var(--ink); }
.doc-content h1{ font-size:1.5em; } .doc-content h2{ font-size:1.25em; } .doc-content h3{ font-size:1.08em; }
.doc-content ul, .doc-content ol{ padding-left:1.4em; }
.doc-content table{ border-collapse:collapse; width:100%; margin:1em 0; font-size:.88em; }
.doc-content th, .doc-content td{ border:1px solid var(--line); padding:7px 9px; text-align:left; }
.doc-content th{ background:var(--violet-100); }
.doc-content code{ background:var(--violet-100); padding:1px 6px; border-radius:5px; font-size:.9em; }
.doc-content blockquote{ border-left:3px solid var(--violet-400); padding-left:14px; color:var(--ink-soft); margin:1em 0; }
.doc-content strong{ color:var(--ink); }

.skeleton-wrap{ padding:22px 4px 4px; }
.progress-steps-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.progress-step-row{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-soft); }
.progress-step-row .dot{ width:16px; height:16px; border-radius:50%; border:2px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; font-size:9px; }
.progress-step-row.done .dot{ background:var(--ok); border-color:var(--ok); color:#fff; }
.progress-step-row.active .dot{ border-color:var(--violet-500); }
.progress-step-row.active{ color:var(--violet-700); font-weight:700; }
[data-theme="dark"] .progress-step-row.active{ color:var(--violet-300); }
.progress-step-row.done{ color:var(--ink); }
.progress-bar-outer{ height:8px; border-radius:99px; background:var(--violet-100); overflow:hidden; margin-bottom:14px; }
.progress-bar-inner{ height:100%; border-radius:99px; background:linear-gradient(120deg,var(--violet-500),var(--indigo-500)); transition:width .5s ease; }
.sk-line{ height:12px; border-radius:6px; background:linear-gradient(90deg,var(--line),var(--violet-100),var(--line)); background-size:200% 100%; animation:shine 1.4s ease-in-out infinite; margin-bottom:12px; }
@keyframes shine{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
.progress-text{ text-align:center; font-weight:700; color:var(--violet-600); font-size:13.5px; margin:4px 0 14px; display:flex; align-items:center; justify-content:center; gap:10px; }
.progress-elapsed{ text-align:center; font-size:11px; color:var(--ink-soft); margin-bottom:10px; }
.spinner{ width:16px; height:16px; border-radius:50%; border:2.5px solid var(--violet-200); border-top-color:var(--violet-600); animation:spin .7s linear infinite; flex:none; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.footer-note{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:50px; }
.toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:12px; font-size:13px; font-weight:700; z-index:200; box-shadow:var(--shadow-lg); max-width:90vw; text-align:center; }

/* ---------------- storage helper ---------------- */
function safeStorage(){
  try{
    const testKey="__t__"; localStorage.setItem(testKey,"1"); localStorage.removeItem(testKey);
    return {
      get:(k)=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } },
      set:(k,v)=>{ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
      remove:(k)=>{ try{ localStorage.removeItem(k); return true; }catch(e){ return false; } },
    };
  }catch(e){
    const mem = {};
    return {
      get:(k)=> (k in mem ? mem[k] : null),
      set:(k,v)=>{ mem[k]=v; return true; },
      remove:(k)=>{ delete mem[k]; return true; },
    };
  }
}
const store = safeStorage();
function debounce(fn, delay){
  let t = null;
  return (...args)=>{ if(t) clearTimeout(t); t = setTimeout(()=>fn(...args), delay); };
}
function sanitizeFilename(s){

function formatBytes(n){
  if(!n && n!==0) return "";
  if(n < 1024) return n + " B";
  if(n < 1024*1024) return (n/1024).toFixed(1) + " KB";
  return (n/(1024*1024)).toFixed(1) + " MB";
}

/* ---------------- system prompt ---------------- */
function buildSystemInstruction(){
  return `Anda adalah asisten ahli kurikulum yang membantu guru di Indonesia menyusun PROGRAM TAHUNAN (PROTA) dan PROGRAM SEMESTER (PROSEM) sesuai Kurikulum Merdeka / kerangka Pembelajaran Mendalam (Permendikdasmen No. 13 Tahun 2025). Ikuti aturan berikut secara KETAT, LENGKAP, dan JANGAN disederhanakan melebihi yang diminta.

=== 0. KEPATUHAN FORMAT (WAJIB, prioritas tertinggi) ===
- JANGAN membungkus jawaban dengan code fence tiga backtick (\`\`\`) dalam bentuk apa pun.
- JANGAN menyisakan placeholder seperti "[isi di sini]" atau "(lengkapi)" — semua bagian harus terisi penuh dan siap pakai.

=== 1. PROGRAM TAHUNAN (PROTA) — kunci PROTA ===
Susun tabel Markdown dengan kolom: No | Elemen / Capaian Pembelajaran (CP) | Materi Pokok / Topik Pembelajaran | Alokasi Waktu (JP) | Semester | Keterangan.
- Urutkan baris Semester Ganjil terlebih dahulu, lalu Semester Genap.
- Jika guru sudah mengisi daftar Elemen & Materi secara manual, GUNAKAN PERSIS daftar tersebut sebagai dasar utama (jangan mengarang materi baru di luar itu). Jika untuk salah satu semester guru belum mengisi apa pun, susunkan sendiri daftar materi yang wajar untuk mata pelajaran & fase terkait.

- WAJIB DIAKHIRI dengan Blok Tanda Tangan berformat tabel dua kolom: kolom kiri "Mengetahui, Kepala Sekolah" beserta baris kosong tanda tangan lalu nama & NIP Kepala Sekolah; kolom kanan tempat/tanggal lalu "Guru Mata Pelajaran" beserta baris kosong tanda tangan lalu nama & NIP/NUPTK Guru Penyusun.

=== 2. PROGRAM SEMESTER (PROSEM) — kunci PROSEMGANJIL dan/atau PROSEMGENAP ===
Susun tabel distribusi mingguan Markdown dengan kolom: No | Materi Pokok | Alokasi JP | Bulan | Minggu Ke- | Keterangan.
- Sebarkan SETIAP materi pokok pada semester terkait ke minggu-minggu efektif secara berurutan dan proporsional sesuai Alokasi JP masing-masing dan Alokasi JP per Minggu yang diberikan guru, dimulai dari minggu pertama semester (Juli untuk Ganjil, Januari untuk Genap, sesuaikan bulan secara wajar bila data lain tidak tersedia).
- Sisipkan baris keterangan non-materi pada minggu yang sesuai (mis. "Penilaian Tengah Semester (PTS)", "Penilaian Akhir Semester (PAS)/Sumatif Akhir Semester", "Libur", atau keterangan lain dari guru) — tandai baris tersebut dengan Materi Pokok "—" dan Alokasi JP "-".
- Setelah tabel, tampilkan bagian "Rekapitulasi": Jumlah Minggu Efektif, Jumlah Minggu Tidak Efektif, dan Jumlah Jam Pelajaran (JP) Efektif untuk semester tersebut.
- WAJIB DIAKHIRI dengan Blok Tanda Tangan dengan format yang SAMA seperti pada Prota (Kepala Sekolah & Guru Mata Pelajaran).

=== 3. PENGGUNAAN BAHAN REFERENSI ===
Jika guru melampirkan bahan referensi (mis. dokumen Capaian Pembelajaran resmi/silabus), jadikan itu basis utama Elemen/CP & Materi Pokok — jangan berhalusinasi di luar konteks dokumen untuk hal-hal faktual yang seharusnya ada di sana.

=== FORMAT KELUARAN WAJIB ===
Semua dokumen yang diminta HARUS saling konsisten (memakai Mata Pelajaran, Fase/Kelas, dan daftar materi yang sama antar dokumen). Tulis setiap dokumen dalam format Markdown rapi (heading, tabel), berbahasa Indonesia baku, siap pakai oleh guru — bukan draf kasar.

Bungkus SETIAP dokumen dengan penanda PERSIS seperti ini, tanpa spasi tambahan, tanpa code fence, dan tanpa teks lain sebelum/sesudah penanda:

Gunakan NAMA_KUNCI sesuai permintaan pada prompt pengguna (PROTA, PROSEMGANJIL, PROSEMGENAP). Jangan menambahkan dokumen di luar yang diminta. Jangan menulis apa pun di luar blok penanda tersebut.

=== CHECKLIST AKHIR SEBELUM MENGIRIM JAWABAN (verifikasi diam-diam, jangan ditampilkan) ===
Pastikan: (1) semua dokumen yang diminta ada dan masing-masing dibungkus penanda yang benar; (2) tabel lengkap tanpa baris kosong/placeholder; (3) rekapitulasi JP & minggu efektif konsisten dengan data guru; (4) blok tanda tangan ada di setiap dokumen; (5) tidak ada teks di luar blok penanda; (6) tidak ada code fence \`\`\` yang membungkus dokumen.`;

/* ---------------- parser hasil AI ---------------- */
function stripFences(s){
  if(!s) return s;
  let t = s.trim();
  t = t.replace(/^```[a-zA-Z]*\n?/,"").replace(/```\s*$/,"");
  t = t.replace(/^<<<\s*DOKUMEN[^>]*>>>\s*/i,"").replace(/<<<\s*END_DOKUMEN\s*>>>\s*$/i,"");
  return t.trim();
}

function parseDocuments(raw, selectedOutputs){
  const docs = {};
  const meta = {};
  if(!raw) raw = "";

  selectedOutputs.forEach(k=>{
    const key = k.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re = new RegExp(
      `<{2,3}\\s*DOKUMEN\\s*:\\s*${key}\\s*>{2,3}([\\s\\S]*?)(?=<{2,3}\\s*END_DOKUMEN\\s*>{2,3}|<{2,3}\\s*DOKUMEN\\s*:|$)`,
      "i"
    );
    const m = raw.match(re);
    if(m && m[1] && m[1].trim().length>0){
      docs[k] = stripFences(m[1]);
      meta[k] = "exact";
    }
  });

  let missing = selectedOutputs.filter(k=>!docs[k]);
  missing.forEach(k=>{
    const label = DOC_LABEL[k].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const headingRe = new RegExp(`(?:^|\\n)#{1,4}\\s*[^\\n]*${label}[^\\n]*\\n([\\s\\S]*?)(?=\\n#{1,4}\\s|$)`, "i");
    const hm = raw.match(headingRe);
    if(hm && hm[1] && hm[1].trim().length>20){
      docs[k] = stripFences(hm[1]);
      meta[k] = "heading";
    }
  });

  missing = selectedOutputs.filter(k=>!docs[k]);
  const foundAny = Object.keys(docs).length>0;
  if(!foundAny && raw.trim() && selectedOutputs.length){
    docs[selectedOutputs[0]] = stripFences(raw);
    meta[selectedOutputs[0]] = "fallback_all";
    missing = missing.filter(k=>k!==selectedOutputs[0]);
  }

  selectedOutputs.forEach(k=>{
    if(docs[k]===undefined){ docs[k]=""; meta[k]="missing"; }
  });

  return {docs, meta};
}

/* ---------------- Gemini API ---------------- */
const RETRYABLE_STATUS = [503, 429];
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function callGemini({apiKey, model, systemInstruction, userPrompt, fileData, onRetry}){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const parts = [{text: userPrompt}];
  if(fileData && fileData.inline){
    parts.push({inlineData:{mimeType:fileData.mimeType, data:fileData.base64}});
  }
  const body = {
    systemInstruction: {parts:[{text: systemInstruction}]},
    contents: [{role:"user", parts}],
    generationConfig: {temperature:0.7, maxOutputTokens:8192},
  };

  const maxAttempts = 5;
  let lastMsg = "";
  for(let attempt=1; attempt<=maxAttempts; attempt++){
    let res;
    try{
      res = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    }catch(networkErr){
      throw new Error(
        "Gagal terhubung ke server Gemini (Failed to fetch) — ini error jaringan/browser SEBELUM sempat memeriksa API key. Penyebab umum: " +
        "(1) tidak ada koneksi internet; (2) ad-blocker memblokir Google API; (3) firewall jaringan sekolah/kantor; (4) dibuka lewat file:// bukan localhost."
      );
    }

    if(res.ok){
      const data = await res.json();
      const cand = data?.candidates?.[0];
      if(!cand) throw new Error("Respons API kosong. Coba lagi atau periksa API key Anda.");
      const text = (cand.content?.parts || []).map(p=>p.text || "").join("\n");
      if(!text.trim()) throw new Error("Model tidak mengembalikan teks. Coba generate ulang.");
      return text;
    }

    let msg = `Gagal memanggil Gemini API (status ${res.status}).`;
    try{ const j = await res.json(); if(j?.error?.message) msg += " " + j.error.message; }catch(e){}
    lastMsg = msg;

    if(RETRYABLE_STATUS.includes(res.status) && attempt < maxAttempts){
      const waitMs = Math.pow(2, attempt - 1) * 1000 + Math.floor(Math.random() * 500);
      if(onRetry) onRetry({attempt, maxAttempts, waitMs, status:res.status});
      await sleep(waitMs);
      continue;
    }
    const extra = res.status===503
      ? " Model sedang dipakai banyak orang (kondisi sementara). Sudah dicoba ulang otomatis beberapa kali — silakan coba lagi sesaat lagi, atau ganti model lain lewat menu ⚙️ Pengaturan."
      : res.status===429
      ? " Kuota/limit permintaan tercapai. Tunggu sebentar lalu coba lagi, atau ganti ke model lain di menu ⚙️ Pengaturan."
      : "";
    throw new Error(lastMsg + extra);
  }
  throw new Error(lastMsg || "Gagal memanggil Gemini API.");
}

/* ---------------- validasi form ---------------- */
function validateForm(form, outputs, apiKey){
  const errors = [];
  const warnings = [];
  const fieldErrors = {};

  if(!apiKey){
    errors.push("API Key Gemini belum diisi. Klik ikon ⚙️ di pojok kanan atas untuk memasukkannya.");
  }
  if(!form.mapel.trim()){ errors.push("Mata Pelajaran wajib diisi."); fieldErrors.mapel = "Wajib diisi."; }
  const jpMinggu = parseInt(form.jpPerMinggu,10);
  if(!form.jpPerMinggu || isNaN(jpMinggu) || jpMinggu<1){ errors.push("Alokasi JP per Minggu harus angka minimal 1."); fieldErrors.jpPerMinggu = "Harus angka ≥ 1."; }
  if(outputs.length === 0){ errors.push("Pilih minimal 1 dokumen output."); fieldErrors.outputs = "Pilih minimal 1."; }

  if(!form.fase) warnings.push("Fase belum dipilih — hasil mungkin kurang sesuai jenjang.");
  if(!form.namaSekolah.trim()) warnings.push("Nama Sekolah belum diisi — kop dokumen Word akan kosong.");
  if(!form.nipKepsek.trim()) warnings.push("NIP Kepala Sekolah belum diisi — blok tanda tangan akan kosong.");
  if(form.tahunPelajaran && !/^\d{4}\/\d{4}$/.test(form.tahunPelajaran.trim())){
    warnings.push("Format Tahun Pelajaran sebaiknya seperti 2026/2027.");
  }
  const needGanjil = outputs.includes("prota") || outputs.includes("prosemGanjil");
  const needGenap = outputs.includes("prota") || outputs.includes("prosemGenap");
  if(needGanjil && !(form.materiGanjil||[]).some(r=>r.materi && r.materi.trim())) warnings.push("Daftar Elemen & Materi Semester Ganjil masih kosong — AI akan menyusunnya secara otomatis.");
  if(needGenap && !(form.materiGenap||[]).some(r=>r.materi && r.materi.trim())) warnings.push("Daftar Elemen & Materi Semester Genap masih kosong — AI akan menyusunnya secara otomatis.");
  if(!form.mingguEfektifGanjil && needGanjil) warnings.push("Jumlah Minggu Efektif Semester Ganjil belum diisi.");
  if(!form.mingguEfektifGenap && needGenap) warnings.push("Jumlah Minggu Efektif Semester Genap belum diisi.");

  return {errors, warnings, fieldErrors};
}

function MateriEditor({rows, onChange, onSuggest, suggesting, jpPerMinggu}){
  const total = (rows||[]).reduce((s,r)=> s + (parseInt(r.jp,10)||0), 0);
  function updateRow(id, field, val){
    onChange(rows.map(r=> r.id===id ? {...r, [field]:val} : r));
  }
  function removeRow(id){
    const next = rows.filter(r=>r.id!==id);
    onChange(next.length ? next : [newMateriRow()]);
  }
  function addRow(){
    onChange([...rows, newMateriRow()]);
  }

            <input className="input" value={r.materi} onChange={e=>updateRow(r.id,"materi",e.target.value)} placeholder="Mis. Operasi hitung bilangan bulat"/>

function downloadBlob(content, filename, mime){
  const blob = new Blob(['\ufeff', content], {type:mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
}

  const [form, setForm] = useState(()=>{
    try{
      const raw = store.get("ps_autosave");

      }
    }catch(e){}
    return DEFAULT_FORM;
  });

  const [outputs, setOutputs] = useState(()=>{
    try{
      const raw = store.get("ps_autosave");
      if(raw){
        const snap = JSON.parse(raw);
        if(snap && Array.isArray(snap.outputs) && snap.outputs.length){
          const order = OUTPUT_DOCS.map(d=>d.key);
          return order.filter(k => snap.outputs.includes(k));
        }
      }
    }catch(e){}
    return ["prota","prosemGanjil","prosemGenap"];
  });

  const [file, setFile] = useState(null);
  const [fileBase64, setFileBase64] = useState(null);
  const [fileTextExtract, setFileTextExtract] = useState("");
  const [dragOver, setDragOver] = useState(false);
  const [fileReading, setFileReading] = useState(false);
  const [fileError, setFileError] = useState("");
  const [lastSaved, setLastSaved] = useState(null);

  const [isGenerating, setIsGenerating] = useState(false);
  const [progressIdx, setProgressIdx] = useState(0);
  const [elapsed, setElapsed] = useState(0);
  const [retryNote, setRetryNote] = useState("");
  const [errors, setErrors] = useState([]);
  const [warnings, setWarnings] = useState([]);
  const [fieldErrors, setFieldErrors] = useState({});
  const [results, setResults] = useState(null);
  const [parseMeta, setParseMeta] = useState({});
  const [activeTab, setActiveTab] = useState(null);
  const [regenKey, setRegenKey] = useState(null);

  const [suggestingGanjil, setSuggestingGanjil] = useState(false);
  const [suggestingGenap, setSuggestingGenap] = useState(false);
  const [isGeneratingInstruksi, setIsGeneratingInstruksi] = useState(false);
  const [isReviewing, setIsReviewing] = useState(false);
  const [showReviewModal, setShowReviewModal] = useState(false);
  const [reviewResult, setReviewResult] = useState("");

  const progressTimer = useRef(null);
  const elapsedTimer = useRef(null);

  useEffect(()=>{ document.documentElement.setAttribute("data-theme", theme); store.set("ps_theme", theme); }, [theme]);
  useEffect(()=>{ store.set("ps_gemini_model", model); }, [model]);
  useEffect(()=>{ if(toast){ const t=setTimeout(()=>setToast(""), 2400); return ()=>clearTimeout(t); } }, [toast]);
  useEffect(()=>{
    if(restoredRef.current){
      restoredRef.current = false;
      setToast("Draft sebelumnya berhasil dipulihkan");
    }
  }, []);
  useEffect(()=>{
    return ()=>{ if(progressTimer.current) clearInterval(progressTimer.current); if(elapsedTimer.current) clearInterval(elapsedTimer.current); };
  }, []);

  const autosave = useMemo(()=> debounce((f,o,fn)=>{
    try{
      const snapshot = {form:f, outputs:o, fileName:fn, savedAt:new Date().toISOString()};
      const ok = store.set("ps_autosave", JSON.stringify(snapshot));
      if(ok) setLastSaved(new Date());
    }catch(e){}
  }, 700), []);
  useEffect(()=>{ autosave(form, outputs, file?file.name:null); }, [form, outputs, file, autosave]);

  function updateField(key, val){
    setForm(f=>({...f, [key]:val}));
    if(fieldErrors[key]) setFieldErrors(fe=>{ const n={...fe}; delete n[key]; return n; });
  }
  function toggleOutput(key){
    setOutputs(o=>{
      const next = o.includes(key) ? o.filter(x=>x!==key) : [...o, key];
      const order = OUTPUT_DOCS.map(d=>d.key);
      return order.filter(k=>next.includes(k));
    });
    if(fieldErrors.outputs) setFieldErrors(fe=>{ const n={...fe}; delete n.outputs; return n; });
  }

  function clearDraft(){
    setForm(DEFAULT_FORM);
    setOutputs(["prota","prosemGanjil","prosemGenap"]);
    setFile(null); setFileBase64(null); setFileTextExtract("");
    store.remove("ps_autosave");
    setToast("Draft dikosongkan");
  }

  function saveSettings(){
    setApiKey(tempKey);
    setModel(tempModel);
    store.set("ps_gemini_key", tempKey);
    store.set("ps_gemini_model", tempModel);
    setShowSettings(false);
    setToast("Pengaturan disimpan");
  }

  function handleFile(f){
    if(!f) return;
    setFileError("");
    const validExt = /\.(pdf|txt|md)$/i.test(f.name);
    if(!validExt){ setFileError("Format file tidak didukung. Gunakan PDF, TXT, atau MD."); return; }
    if(f.size > 50*1024*1024){ setFileError("Ukuran file referensi maksimal 50MB."); return; }
    setFile(f);
    setFileReading(true);
    const isPdf = f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf");
    const reader = new FileReader();
    reader.onerror = ()=>{ setFileReading(false); setFileError("Gagal membaca file. Coba file lain."); setFile(null); };
    if(isPdf){
      reader.onload = (e)=>{
        try{
          const base64 = e.target.result.split(",")[1];
          setFileBase64({inline:true, mimeType:"application/pdf", base64});
          setFileTextExtract("");
        }catch(err){ setFileError("Gagal memproses file PDF."); }
        finally{ setFileReading(false); }
      };
      reader.readAsDataURL(f);
    }else{
      reader.onload = (e)=>{
        const full = String(e.target.result);
        setFileTextExtract(full.slice(0, 20000));
        setFileBase64(null);
        setFileReading(false);
        if(full.length > 20000) setToast("Referensi dipotong ke 20.000 karakter pertama");
      };
      reader.readAsText(f);
    }
  }
  function removeFile(){
    setFile(null); setFileBase64(null); setFileTextExtract(""); setFileError("");
  }

  // --- Fitur bertenaga LLM ---
  function parseSuggestedRows(text){
    let t = (text||"").trim();
    t = t.replace(/^```[a-zA-Z]*\n?/,"").replace(/```\s*$/,"").trim();
    const first = t.indexOf("["); const last = t.lastIndexOf("]");
    if(first>=0 && last>first) t = t.slice(first, last+1);
    const arr = JSON.parse(t);
    if(!Array.isArray(arr) || !arr.length) throw new Error("Format tidak sesuai.");
    return arr.map(o=>({...newMateriRow(), elemen:String(o.elemen||"").trim(), materi:String(o.materi||"").trim(), jp:o.jp?String(o.jp):""}));
  }

  async function handleSuggestMateri(semKey, semLabel, setBusy){
    if(!apiKey){ setToast("Harap isi API Key Gemini dulu di Pengaturan (⚙️)."); return; }
    if(!form.mapel.trim()){ setToast("Harap isi Mata Pelajaran terlebih dahulu."); return; }
    setBusy(true);
    try{
      const prompt = `Berikan daftar Elemen/Capaian Pembelajaran (CP) dan Materi Pokok yang wajar untuk Mata Pelajaran: ${form.mapel}, Fase: ${form.fase||'Umum'}, Kelas: ${form.kelas||'Umum'}, pada Semester ${semLabel}, sebanyak 6-8 materi pokok, dengan estimasi Alokasi Waktu (JP) masing-masing berupa kelipatan wajar dari ${form.jpPerMinggu||2} JP per minggu. Jawab HANYA dengan JSON array valid tanpa teks lain, tanpa code fence, dengan struktur persis: [{"elemen":"...","materi":"...","jp":angka}, ...]`;
      const text = await callGemini({apiKey, model, systemInstruction:"Anda adalah ahli perumus kurikulum yang sangat ringkas dan selalu menjawab dalam format JSON valid.", userPrompt:prompt, fileData:null});
      const rows = parseSuggestedRows(text);
      updateField(semKey, rows);
      setToast(`✨ Elemen & Materi Semester ${semLabel} otomatis ditambahkan!`);
    }catch(e){
      setToast("Gagal menyarankan materi: " + (e.message||"format respons tidak sesuai."));
    }finally{
      setBusy(false);
    }
  }

  async function handleSuggestInstruksi(){
    if(!apiKey){ setToast("Harap isi API Key Gemini dulu di Pengaturan (⚙️)."); return; }
    if(!form.mapel.trim()){ setToast("Harap isi Mata Pelajaran terlebih dahulu."); return; }
    setIsGeneratingInstruksi(true);
    try{
      const prompt = `Buatkan 1 paragraf singkat instruksi khusus kepada asisten AI agar saat menyusun Program Tahunan & Program Semester untuk Mapel: ${form.mapel}, Fase: ${form.fase||'Umum'} hasilnya lebih runtut, proporsional pembagian JP-nya, dan mempertimbangkan hari besar/libur nasional secara wajar. Langsung berikan kalimat instruksinya saja.`;
      const text = await callGemini({apiKey, model, systemInstruction:"Anda adalah ahli pembuat prompt AI untuk guru yang ringkas.", userPrompt:prompt, fileData:null});
      updateField("instruksiKhusus", text.trim());
      setToast("✨ Instruksi otomatis berhasil ditambahkan!");
    }catch(e){
      setToast("Gagal menyarankan instruksi: " + e.message);
    }finally{
      setIsGeneratingInstruksi(false);
    }
  }

  async function handleAIReview(){
    if(!apiKey){ setToast("Harap isi API Key Gemini dulu di Pengaturan (⚙️)."); return; }
    if(!form.mapel.trim()){ setToast("Minimal isi Mata Pelajaran untuk direview."); return; }
    setIsReviewing(true);
    try{
      const totalGanjil = (form.materiGanjil||[]).reduce((s,r)=>s+(parseInt(r.jp,10)||0),0);
      const totalGenap = (form.materiGenap||[]).reduce((s,r)=>s+(parseInt(r.jp,10)||0),0);
      const draftContext = `Mapel: ${form.mapel}\nFase/Kelas: ${form.fase||'-'}/${form.kelas||'-'}\nJP per Minggu: ${form.jpPerMinggu}\nMinggu Efektif Ganjil: ${form.mingguEfektifGanjil} (target JP ±${(parseInt(form.jpPerMinggu,10)||0)*(parseInt(form.mingguEfektifGanjil,10)||0)})\nTotal JP Materi Ganjil terisi: ${totalGanjil}\nMinggu Efektif Genap: ${form.mingguEfektifGenap} (target JP ±${(parseInt(form.jpPerMinggu,10)||0)*(parseInt(form.mingguEfektifGenap,10)||0)})\nTotal JP Materi Genap terisi: ${totalGenap}\nJumlah Materi Ganjil: ${(form.materiGanjil||[]).filter(r=>r.materi&&r.materi.trim()).length}\nJumlah Materi Genap: ${(form.materiGenap||[]).filter(r=>r.materi&&r.materi.trim()).length}`;
      const prompt = `Review secara singkat dan kritis rancangan Program Tahunan/Semester berikut (maksimal 3 paragraf). Fokus pada kesesuaian total JP materi terhadap target minggu efektif x JP per minggu, kewajaran sebaran materi, dan beri 1 pujian spesifik serta 2 saran praktis untuk perbaikan.\n\n${draftContext}`;
      const text = await callGemini({apiKey, model, systemInstruction:"Anda adalah supervisor kurikulum yang ramah, konstruktif, dan tajam dengan angka.", userPrompt:prompt, fileData:null});
      setReviewResult(text.trim());
      setShowReviewModal(true);
    }catch(e){
      setToast("Gagal melakukan review: " + e.message);
    }finally{
      setIsReviewing(false);
    }
  }

  function startProgressCycle(steps){
    setProgressIdx(0);
    setElapsed(0);
    progressTimer.current = setInterval(()=>{
      setProgressIdx(i=> Math.min(i+1, steps.length-1));
    }, 2600);
    elapsedTimer.current = setInterval(()=> setElapsed(s=>s+1), 1000);
  }
  function stopProgressCycle(){
    if(progressTimer.current) clearInterval(progressTimer.current);
    if(elapsedTimer.current) clearInterval(elapsedTimer.current);
  }

  async function handleGenerate(){
    const v = validateForm(form, outputs, apiKey);
    setErrors(v.errors); setWarnings(v.warnings); setFieldErrors(v.fieldErrors);
    if(v.errors.length){ window.scrollTo({top:0, behavior:"smooth"}); return; }
    const steps = buildProgressSteps(outputs);
    setIsGenerating(true);
    setResults(null);
    setRetryNote("");
    startProgressCycle(steps);
    try{
      const sys = buildSystemInstruction();
      const userPrompt = buildUserPrompt(form, outputs, fileTextExtract, file?file.name:null);
      const raw = await callGemini({apiKey, model, systemInstruction:sys, userPrompt, fileData:fileBase64, onRetry:({attempt, maxAttempts, status})=>{
        setRetryNote(`Server ${status===503?"sedang sibuk":"membatasi permintaan"} — mencoba ulang otomatis (percobaan ${attempt+1}/${maxAttempts})...`);
      }});
      setRetryNote("");
      const parsed = parseDocuments(raw, outputs);
      setResults(parsed.docs);
      setParseMeta(parsed.meta);
      setActiveTab(outputs[0]);
      const fallbackUsed = Object.values(parsed.meta).some(m=> m!=="exact");
      const entry = {
        id: Date.now().toString(),
        title: `${form.mapel || "Mapel"} — ${form.tahunPelajaran || "TP"}`,
        timestamp: new Date().toLocaleString("id-ID"),
        results: parsed.docs,
        parseMeta: parsed.meta,
        outputs,
        form,
      };
      const newHist = [entry, ...history].slice(0, 30);
      setHistory(newHist);
      try{ store.set("ps_history", JSON.stringify(newHist)); }catch(e){}
      setToast(fallbackUsed ? "Berhasil dibuat (sebagian dipisah otomatis oleh parser cerdas)" : "Dokumen berhasil dibuat");
    }catch(e){
      setRetryNote("");
      setErrors([e.message || "Terjadi kesalahan saat memanggil Gemini API."]);
      window.scrollTo({top:0, behavior:"smooth"});
    }finally{
      setIsGenerating(false);
      stopProgressCycle();
    }
  }

  async function handleRegenerate(docKey){
    if(!apiKey){ setErrors(["API Key Gemini belum diisi. Klik ikon ⚙️ untuk memasukkannya."]); return; }
    setRegenKey(docKey);
    try{
      const sys = buildSystemInstruction();
      const userPrompt = buildUserPrompt(form, [docKey], fileTextExtract, file?file.name:null) + `\n\nFokus HANYA membuat ulang dokumen ${DOC_LABEL[docKey]} (kunci ${docKey.toUpperCase()}), dengan variasi baru namun tetap konsisten dengan konteks di atas.`;
      const raw = await callGemini({apiKey, model, systemInstruction:sys, userPrompt, fileData:fileBase64, onRetry:({attempt, maxAttempts, status})=>{
        setToast(`Server ${status===503?"sibuk":"membatasi permintaan"}, mencoba ulang (${attempt+1}/${maxAttempts})...`);
      }});
      const parsed = parseDocuments(raw, [docKey]);
      setResults(r=>({...r, [docKey]: parsed.docs[docKey] || r[docKey]}));
      setParseMeta(pm=>({...pm, [docKey]: parsed.meta[docKey]}));
      setToast(`${DOC_LABEL[docKey]} berhasil dibuat ulang`);
    }catch(e){
      setToast("Gagal regenerate: " + (e.message||""));
    }finally{
      setRegenKey(null);
    }
  }

        {isGenerating && (
          <div className="skeleton-wrap">
            <div className="progress-bar-outer"><div className="progress-bar-inner" style={{width:progressPct+"%"}}></div></div>
            <div className="progress-text"><span className="spinner"></span>{steps[progressIdx]}</div>
            <div className="progress-elapsed">⏱ {elapsed} detik berjalan</div>
            {retryNote && <div className="warn-box retry-note">🔄 {retryNote}</div>}
            <div className="progress-steps-list">
              {steps.map((s,i)=>(
                <div key={i} className={"progress-step-row" + (i<progressIdx?" done":"") + (i===progressIdx?" active":"")}>
                  <span className="dot">{i<progressIdx?"✓":""}</span>
                  <span>{s}</span>
                </div>
              ))}
            </div>
            <div className="sk-line" style={{width:"92%"}}></div>
            <div className="sk-line" style={{width:"78%"}}></div>
          </div>
        )}

        {results && !isGenerating && (
          <div className="results-wrap">
            <div className="results-badges">
              <div className="pill"><i style={{background:"var(--mindful)"}}></i>Elemen &amp; CP Selaras</div>
              <div className="pill"><i style={{background:"var(--meaning)"}}></i>Alokasi JP Presisi</div>
              <div className="spacer"></div>
              <button className="tool-btn" onClick={downloadAllDoc}><IconStack/>Export Semua (1 File Word)</button>
            </div>
            <div className="tabs">
              {outputs.map(k=>(
                <button key={k} className={"tab"+(activeTab===k?" active":"")} onClick={()=>setActiveTab(k)}>
                  {parseMeta[k] && parseMeta[k]!=="exact" && <span className="tab-warn-dot" title="Dipisahkan otomatis oleh parser cerdas"></span>}
                  {DOC_LABEL[k]}
                </button>
              ))}
            </div>
            <div className="tab-panel">
              {outputs.map(k=> activeTab===k && (
                <div key={k}>
                  {parseMeta[k] && parseMeta[k]!=="exact" && parseMeta[k]!=="missing" && (
                    <div className="parse-warn-note">⚠️ Dokumen ini dipisahkan otomatis oleh parser cerdas (penanda dari AI tidak lengkap). Periksa kembali batas kontennya.</div>
                  )}
                  {parseMeta[k]==="missing" && (
                    <div className="parse-warn-note">⚠️ Konten untuk dokumen ini tidak ditemukan dalam respons AI. Coba tombol "Regenerate bagian ini".</div>
                  )}
                  <div className="tab-toolbar">
                    <button className="tool-btn" onClick={()=>copyText(results[k]||"")} disabled={!results[k]}><IconCopy/>Salin</button>
                    <button className="tool-btn" onClick={()=>downloadMd(k, results[k]||"")} disabled={!results[k]}><IconDownload/>.md</button>
                    <button className="tool-btn" onClick={()=>downloadDoc(k, results[k]||"")} disabled={!results[k]}><IconDownload/>.doc</button>
                    <button className="tool-btn" onClick={()=>handleRegenerate(k)} disabled={regenKey===k}>
                      {regenKey===k ? <span className="spinner"></span> : <IconRefresh/>}
                      {regenKey===k ? "Membuat ulang..." : "Regenerate bagian ini"}
                    </button>
                  </div>
                  {results[k] ? (
                    <div className="doc-content" dangerouslySetInnerHTML={{__html: buildKopHtml(form, DOC_LABEL[k], DOC_SEMESTER_LABEL[k], false) + renderMd(results[k])}}></div>
                  ) : (
                    <div className="hint">Belum ada konten untuk dokumen ini.</div>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="footer-note">Disusun sesuai Kurikulum Merdeka — Permendikdasmen No. 13/2025 · Ditenagai oleh Gemini API (BYOK)</div>
        <div className="footer-note" style={{marginTop:6}}>Made with <span style={{background:"linear-gradient(135deg, var(--violet-500), var(--indigo-500))", WebkitBackgroundClip:"text", backgroundClip:"text", color:"transparent"}}>♥</span> by Burhanudin, S.Kom - Skanetra Jawara</div>
      </div>

      {showSettings && (
        <div className="modal-backdrop" onClick={()=>setShowSettings(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <button className="modal-close" onClick={()=>setShowSettings(false)}>✕</button>
            <h3>Pengaturan</h3>
            <p className="hint" style={{marginBottom:16}}>Kunci disimpan hanya di penyimpanan lokal browser ini (tidak dikirim ke mana pun selain langsung ke Google saat generate).</p>
            <div className="field" style={{marginBottom:14}}>
              <label>API Key Gemini Anda</label>
              <div className="pw-wrap">
                <input className="input" type={showKey?"text":"password"} value={tempKey} onChange={e=>setTempKey(e.target.value)} placeholder="AQ.Ab... (format baru)" autoFocus/>
                <button className="pw-toggle" onClick={()=>setShowKey(s=>!s)}>{showKey?"🙈":"👁️"}</button>
              </div>
              <div className="hint">Belum punya key? Dapatkan gratis di <a className="link" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">Google AI Studio</a>. Sejak pertengahan 2026 Google menerbitkan key format baru berawalan <b>AQ.</b> (menggantikan format lama <b>AIza...</b>) — tempel apa adanya, key lama maupun baru sama-sama didukung di sini.</div>
            </div>
            <div className="field">
              <label>Model Gemini</label>
              <select className="input" value={tempModel} onChange={e=>setTempModel(e.target.value)}>
                <optgroup label="Gratis">
                  {GEMINI_MODEL_CHOICES.filter(m=>m.tier==="free").map(m=>(<option key={m.value} value={m.value}>{m.label}</option>))}
                </optgroup>
                <optgroup label="Berbayar">
                  {GEMINI_MODEL_CHOICES.filter(m=>m.tier==="pro").map(m=>(<option key={m.value} value={m.value}>{m.label}</option>))}
                </optgroup>
              </select>
            </div>
            <div className="modal-actions">
              <button className="btn ghost" onClick={()=>setShowSettings(false)}>Batal</button>
              <button className="btn primary" onClick={saveSettings}>Simpan</button>
            </div>
          </div>
        </div>
      )}

      {showReviewModal && (
        <div className="modal-backdrop" onClick={()=>setShowReviewModal(false)}>
          <div className="modal wide" onClick={e=>e.stopPropagation()}>
            <button className="modal-close" onClick={()=>setShowReviewModal(false)}>✕</button>
            <h3 style={{display:'flex', alignItems:'center', gap:8}}>✨ Review Rancangan Prota &amp; Prosem</h3>
            <p className="hint" style={{marginBottom:16}}>Saran instan dari AI sebelum Anda men-generate dokumen penuh.</p>
            <div className="doc-content prompt-pre" style={{background:'var(--violet-50)'}} dangerouslySetInnerHTML={{__html: renderMd(reviewResult)}}></div>
            <div className="modal-actions" style={{justifyContent:'flex-end'}}>
              <button className="btn primary" onClick={()=>setShowReviewModal(false)}>Tutup &amp; Lanjutkan</button>
            </div>
          </div>
        </div>
      )}

      {showHistory && (
        <div className="modal-backdrop" onClick={()=>setShowHistory(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <button className="modal-close" onClick={()=>setShowHistory(false)}>✕</button>
            <h3>Riwayat Generate</h3>
            <p className="hint" style={{marginBottom:16}}>Klik salah satu untuk memuat ulang hasilnya.</p>
            {history.length===0 ? (
              <div className="hist-empty">Belum ada riwayat generate.</div>
            ) : history.map(h=>(
              <div key={h.id} className="hist-item" onClick={()=>loadHistory(h)}>
                <div>
                  <div className="hist-title">{h.title}</div>
                  <div className="hist-time">{h.timestamp}</div>
                </div>
                <button className="hist-del" title="Hapus" onClick={(e)=>deleteHistory(h.id, e)}>✕</button>
              </div>
            ))}
          </div>
        </div>
      )}

      <PromptPreviewModal
        open={showPreview}
        onClose={()=>setShowPreview(false)}
        systemText={buildSystemInstruction()}
        userText={buildUserPrompt(form, outputs.length?outputs:["prota"], fileTextExtract, file?file.name:null)}
        onCopy={copyText}
      />

      <Toast message={toast}/>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
